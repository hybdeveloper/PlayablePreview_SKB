name: Deploy Playable Preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer commit (e.g. several quick edits from the site) cancels the older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job instead of build + deploy: skips a second runner start-up (~10-20 s).
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # full history -> real "Modified" dates
          filter: blob:none   # ...but only the current files' contents, not every old version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build.js --out dist
        env:
          PREVIEW_ACCESS: ${{ secrets.PREVIEW_ACCESS }}   # passwords/folders JSON; empty = no password
          PREVIEW_EDIT_TOKEN: ${{ secrets.PREVIEW_EDIT_TOKEN }}   # GitHub token for users with "edit": true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
