name: Deploy Playable Preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer commit (e.g. several quick edits from the site) cancels the older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job instead of build + deploy: skips a second runner start-up (~10-20 s).
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Games are loaded by the page straight from GitHub, so the build only needs
      # their names and sizes: skip checking out games/ (history is kept for the
      # "Modified" dates, without file contents).
      # To bundle games into the site instead (PREVIEW_GAMES: bundle), remove the
      # sparse-checkout lines and PREVIEW_TREE below.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/games/
      - name: List games from the commit tree
        run: >
          curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" -o "$RUNNER_TEMP/tree.json"
        env:
          GH_TOKEN: ${{ github.token }}
      # Node from the runner image (no setup-node download).
      - run: node scripts/build.js --out dist
        env:
          PREVIEW_TREE: ${{ runner.temp }}/tree.json
          PREVIEW_ACCESS: ${{ secrets.PREVIEW_ACCESS }}   # passwords/folders JSON; empty = no password
          PREVIEW_EDIT_TOKEN: ${{ secrets.PREVIEW_EDIT_TOKEN }}   # GitHub token for users with "edit": true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
